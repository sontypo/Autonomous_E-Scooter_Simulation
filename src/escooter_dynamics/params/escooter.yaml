# Configuration Settings

# Robot name space
NAME_SPACE: "/e_scooter/"

# Non teleop mode for naviagtion stack, Gazebo, etc type modes.
# Controller will still have standup and sitdown functions for safty reasons 
NON_TELEOP: false

# Speed limit in Hz for the master loop rate
MASTER_LOOP_RATE: 500

# Static time division to convert cmd_vel into segments for controller loop
VELOCITY_DIVISION: 0.033

# Twist Max Values
# Sim
MAX_METERS_PER_SEC: 0.6944444444444444
MAX_RADIANS_PER_SEC: 1.71440329

# Distance between handle bar and center of mass (assume that there is no gap in z axis between these two)
HANDLE_BAR_TO_COM: 0.297

# Define the center of mass position
# Sim
COM_POS_X: 0.203
COM_POS_Y: 0.0
COM_POS_Z: 0.392    # (h) Ground to center of mass position

# Origin position
# Sim
OG_POS_X: 0.0
OG_POS_Y: 0.0
OG_POS_Z: 0.197     # Ground to origin

# Weights
# BODY_WEIGHT Sim: 9.4259 + 1.8503 + 0.79986 
BODY_WEIGHT: 12.07606  # base_link + back_wheel + Rotational_motor
R_PLATE_WEIGHT: 2.18948
F_WHEEL_WEIGHT: 2.0732
HANDLE_BAR_WEIGHT: 3.5678
WHOLE_BODY_WEIGHT: 18.90654
WHOLE_BODY_WEIGHT_EXC: 17.71706

# Wheel radius: front wheel and left wheel are equal to each other
# Sim
WHEEL_RADIUS: 0.135 # meter

# Height, width
BODY_HEIGHT: 1.3
BODY_WIDTH: 1.3
WHEEL_SEPARATION_DIS: 1.0
B_WHEEL_TO_COM: 0.703   # (r) WHEEL_SEPARATION_DIS / 2 + COM_POS_X
BASE_TO_COM: 0.195 # COM_POS_Z - OG_POS_Z

# Body FK maximum rotation
# BODY_MAX_ROLL: !degrees 12

# Body maximum steering angle
MAX_STEERING_ANGLE: 0.785398163     # 45 degrees

# Initialized angle for each joints available in e-scooter
INIT_HANLDE_BAR_ANGLE: 0.0
INIT_R_PLATE_ANGLE: 0.0 # optional
INIT_F_WHEEL_ANGLE: 0.0 # optional

# Cycle length is the number of periods the travel is divided into ( Gait Settings )
CYCLE_LENGTH: 50

# Speed in Hz that the joints interpolate between gait poses
INTERPOLATION_LOOP_RATE: 300

# Uncertainties parameter
UNCERTAINTIES: 0.01

# Balancing parameters.
#
# The reaction plate cancels gravity with PD_PDplus * (C*cos(theta) +
# G*sin(theta)) and then holds the body upright with a PD loop, so the closed
# loop reduces to  I_b * theta_ddot = -KP*theta - KD*theta_dot.  Gains scale
# with the roll inertia about the wheel contact line,
# I_b ~ WHOLE_BODY_WEIGHT * COM_POS_Z^2 = 2.905 kg.m^2:
#
#     KP = I_b * wn^2            KD = 2 * zeta * wn * I_b
#
# with wn = 4 rad/s and zeta = 1.0 (critically damped, no overshoot).
# The previous KP: 2.0 / KD: 0.05 are wn = 0.83 rad/s and zeta = 0.015, far too
# soft to hold 18.9 kg up - and were applied with the wrong sign on top of that.
PD_PDplus: 1.0
KP: 46.5
KD: 23.2

# Saturation of the balancing torque. The joint allows 500 N.m, but the plate
# only stores 12 N.m.s of momentum: saturating at the joint limit dumps all of
# it into the body in a fraction of a second and throws the scooter over.
# Holding 45 degrees of lean needs 51 N.m.
MAX_BALANCING_TORQUE: 150.0

# Bound on the open-loop roll-rate prediction of the forward model. The model no
# longer drives the actuator but it still integrates, so it needs a limit.
MAX_MODEL_ROLL_RATE: 50.0

# Momentum management for the reaction plate, in rad of lean per rad/s of plate
# speed. A reaction wheel can only trade momentum, so any constant bias torque -
# here a few millimetres of lateral centre-of-mass offset - winds it up until it
# saturates. Measured without this term: the plate drifts 7.6 rad/s per second
# and the scooter falls after about 26 s. The plate settles at
# omega = -(1 + G/KP) * theta_bias / MOMENTUM_UNLOAD_GAIN, so 1e-4 would settle
# right on the 200 rad/s limit while 5e-4 settles near -35 rad/s.
# Set to 0.0 to hold exactly upright again, with that caveat.
MOMENTUM_UNLOAD_GAIN: 0.0005
# Hard bound on how far the bias above may tilt the setpoint, in rad.
MAX_LEAN_SETPOINT: 0.035

# Number of joints
NUMBER_OF_JOINTS: 3

# Joint descriptions
JOINTS: {
    '0': {name: handle_bar_chasis_joint, sign: 1},
    '1': {name: rotational_plate_joint, sign: 1},
    '2': {name: front_wheel_joint, sign: -1},
    '3': {name: back_wheel_joint, sign: -1},
}