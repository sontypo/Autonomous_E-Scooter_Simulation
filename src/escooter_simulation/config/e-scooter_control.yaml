e_scooter:

# Publish all joint states -----------------------------------
    joint_state_controller:
        type: joint_state_controller/JointStateController
        publish_rate: 50


# Joint Effort Controllers ---------------------------------------
    rotational_plate_joint_effort_controller:
        type: effort_controllers/JointEffortController
        joint: rotational_plate_joint
        pid: {p: 50.0, i: 3.0, d: 0.01}

# Joint Position Controllers ---------------------------------------
    handle_bar_chasis_joint_position_controller:
        type: effort_controllers/JointPositionController
        joint: handle_bar_chasis_joint
        # Raised with the joint's effort limit: at p = 100 the loop saturated
        # at 23 degrees of error and the bars were back-driven off their stop.
        pid: {p: 400.0, i: 20.0, d: 40.0}

# Joint Velocity Controllers ---------------------------------------
    front_wheel_joint_velocity_controller:
        type: velocity_controllers/JointVelocityController
        # type: effort_controllers/JointVelocityController
        joint: front_wheel_joint
        # pid: {p: 20.0, i: 2.0, d: 0.1}

    gazebo_ros_control:
        pid_gains:
            front_wheel_joint: {p: 10.0, i: 2.0, d: 0.1}


controller_joint_names: [ 'handle_bar_chasis_joint', 
                          'rotational_plate_joint', 
                          'front_wheel_joint', 
                          'back_wheel_joint' ]
